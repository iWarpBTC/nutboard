# nginx site for nutboard at https://nutboard.lnpay.cz → the Node app on 127.0.0.1:26545.
# Install as root:  cp /opt/nutboard/deploy/nutboard.lnpay.cz.conf /etc/nginx/sites-available/nutboard.lnpay.cz
#                   ln -s /etc/nginx/sites-available/nutboard.lnpay.cz /etc/nginx/sites-enabled/
#                   nginx -t && systemctl reload nginx
# nginx serves no files for this site (no root, no /var/www): everything goes to the app.

server {
    listen 80;
    listen [::]:80;
    server_name nutboard.lnpay.cz;

    # Redirect inside a location, not at server level, so certbot's renewal can still answer its challenge on :80.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nutboard.lnpay.cz;

    ssl_certificate     /etc/letsencrypt/live/nutboard.lnpay.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nutboard.lnpay.cz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/nutboard.lnpay.cz.access.log;
    error_log  /var/log/nginx/nutboard.lnpay.cz.error.log;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:26545;
        proxy_http_version 1.1;
        proxy_set_header Host $host;                       # the app checks it: keep it
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
